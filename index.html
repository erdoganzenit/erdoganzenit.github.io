<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erdoğan Zenit | Edge-AI & Embedded Systems Portfolio</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        /* === MODERN RENK PALETİ & DEĞİŞKENLER === */
        :root {
            --bg-base: #060913;
            --bg-surface: rgba(15, 23, 42, 0.65);
            --bg-surface-hover: rgba(30, 41, 59, 0.8);
            --bg-glass: rgba(10, 15, 29, 0.75);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #10b981; /* Emerald - Donanım & Gömülü Sistem vurgusu */
            --accent-secondary: #6366f1; /* Indigo - AI & Algoritma vurgusu */
            --accent-cyan: #06b6d4;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(16, 185, 129, 0.4);
            --shadow-glow: 0 20px 50px -15px rgba(16, 185, 129, 0.15);
            --grid-color: rgba(255, 255, 255, 0.025);
            --transition-smooth: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        [data-theme="light"] {
            --bg-base: #f8fafc;
            --bg-surface: rgba(255, 255, 255, 0.85);
            --bg-surface-hover: rgba(241, 245, 249, 0.95);
            --bg-glass: rgba(255, 255, 255, 0.85);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-primary: #059669;
            --accent-secondary: #4f46e5;
            --accent-cyan: #0284c7;
            --border-subtle: rgba(15, 23, 42, 0.08);
            --border-highlight: rgba(5, 150, 105, 0.4);
            --shadow-glow: 0 20px 40px -15px rgba(15, 23, 42, 0.08);
            --grid-color: rgba(15, 23, 42, 0.035);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
            position: relative;
        }

        /* Mühendislik Izgarası (Grid) Arka Planı */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at 50% 30%, black 30%, transparent 85%);
            -webkit-mask-image: radial-gradient(circle at 50% 30%, black 30%, transparent 85%);
            z-index: -2;
            pointer-events: none;
        }

        /* Ambient Orbs (Yumuşak Arka Plan Işıkları) */
        .ambient-light {
            position: fixed;
            border-radius: 50%;
            filter: blur(130px);
            opacity: 0.22;
            z-index: -1;
            pointer-events: none;
            animation: floatOrb 18s infinite alternate ease-in-out;
        }
        .orb-1 {
            width: 500px; height: 500px;
            background: var(--accent-secondary);
            top: -150px; left: -100px;
        }
        .orb-2 {
            width: 450px; height: 450px;
            background: var(--accent-primary);
            bottom: -100px; right: -100px;
            animation-delay: -7s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(60px, 40px) scale(1.15); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-primary); }

        /* === FLOATING PILL NAVBAR === */
        .nav-wrapper {
            position: fixed;
            top: 24px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 1000;
            padding: 0 20px;
        }

        nav {
            width: 100%;
            max-width: 1100px;
            padding: 14px 28px;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-subtle);
            border-radius: 100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.3);
            transition: var(--transition-smooth);
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo-dot {
            width: 10px;
            height: 10px;
            background: var(--accent-primary);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 12px var(--accent-primary);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: var(--transition-smooth);
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 20px;
        }

        .nav-links a:hover {
            color: var(--text-primary);
            background: var(--border-subtle);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 1px solid var(--border-subtle);
            padding-left: 20px;
        }

        .control-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .control-btn:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            transform: translateY(-2px);
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.4rem;
            cursor: pointer;
        }

        /* === ORTAK CONTAINER & BAŞLIKLAR === */
        .container {
            max-width: 1140px;
            margin: 0 auto;
            padding: 0 24px;
        }

        section {
            padding: 110px 0;
        }

        .section-header {
            margin-bottom: 50px;
        }

        .section-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--accent-primary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: inline-block;
            margin-bottom: 10px;
        }

        .section-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.3rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        /* === HERO SECTION (2 SÜTUNLU & TERMINAL) === */
        #hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 120px;
            padding-bottom: 60px;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 50px;
            align-items: center;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 100px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--accent-primary);
            margin-bottom: 24px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-primary);
            border-radius: 50%;
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
            70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .hero-name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 4rem;
            font-weight: 700;
            line-height: 1.08;
            letter-spacing: -1.5px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--text-primary) 40%, var(--accent-primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-role {
            font-size: 1.45rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 24px;
            min-height: 2.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .typewriter-text {
            color: var(--accent-secondary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.25rem;
            border-right: 2px solid var(--accent-primary);
            padding-right: 5px;
            animation: blinkCursor 0.8s infinite;
        }

        @keyframes blinkCursor {
            50% { border-color: transparent; }
        }

        .hero-desc {
            font-size: 1.08rem;
            color: var(--text-secondary);
            margin-bottom: 36px;
            max-width: 560px;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }

        .btn-primary {
            padding: 14px 30px;
            background: linear-gradient(135deg, var(--accent-primary), #059669);
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 12px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: none;
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px -5px rgba(16, 185, 129, 0.55);
        }

        .btn-secondary {
            padding: 14px 28px;
            background: var(--bg-surface);
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 12px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--border-subtle);
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .btn-secondary:hover {
            border-color: var(--accent-secondary);
            transform: translateY(-3px);
        }

        /* Sağ Sütun: Mühendislik Terminali */
        .terminal-window {
            background: rgba(10, 14, 24, 0.9);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-glow);
            backdrop-filter: blur(12px);
            transition: var(--transition-smooth);
        }

        [data-theme="light"] .terminal-window {
            background: #0f172a;
            color: #f8fafc;
        }

        .terminal-window:hover {
            border-color: var(--border-highlight);
            transform: translateY(-5px);
        }

        .terminal-header {
            background: rgba(255, 255, 255, 0.04);
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .terminal-dots {
            display: flex;
            gap: 8px;
        }
        .dot { width: 11px; height: 11px; border-radius: 50%; }
        .dot.red { background: #ef4444; }
        .dot.yellow { background: #f59e0b; }
        .dot.green { background: #10b981; }

        .terminal-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .terminal-body {
            padding: 24px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.7;
            color: #e2e8f0;
        }

        .cmd-prompt { color: #10b981; margin-right: 8px; }
        .code-key { color: #38bdf8; }
        .code-str { color: #a7f3d0; }
        .code-num { color: #fca5a5; }
        .code-comment { color: #64748b; font-style: italic; }

        /* === SPOTLIGHT EFEKTLİ BENTO KARTLAR (YETKİNLİKLER) === */
        .bento-skills {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 28px;
        }

        .spotlight-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 36px;
            position: relative;
            overflow: hidden;
            transition: var(--transition-smooth);
            backdrop-filter: blur(10px);
        }

        /* Mouse Takip Eden Spotlight Işığı */
        .spotlight-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(
                600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                rgba(16, 185, 129, 0.12),
                transparent 40%
            );
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .spotlight-card:hover::before {
            opacity: 1;
        }

        .spotlight-card:hover {
            border-color: var(--border-highlight);
            transform: translateY(-4px);
            box-shadow: var(--shadow-glow);
        }

        .skill-group-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
        }

        .skill-icon-box {
            width:
